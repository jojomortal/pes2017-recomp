name: Build iOS App

on:
  workflow_dispatch: # Permite que você ative o build manualmente pelo botão no GitHub

jobs:
  build-ios:
    name: build-ios
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        run: |
          echo "Instalando o Vulkan SDK para corrigir o erro vulkan.h..."
          brew install vulkan-sdk

      - name: Configure CMake for iOS Project
        run: |
          mkdir -p build_ios
          cd build_ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile and Archive App
        run: |
          cd build_ios
          xcodebuild -target 'pes2017recomp' -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE=""

      - name: Package into Unsigned IPA with Mods & Ultra Performance Support
        run: |
          mkdir -p Payload
          # Ajuste o caminho abaixo se o nome do arquivo .app gerado pelo seu CMake for diferente
          if [ -d "build_ios/Release-iphoneos/pes2017recomp.app" ]; then
            cp -r build_ios/Release-iphoneos/pes2017recomp.app Payload/
          else
            cp -r build_ios/*.app Payload/ 2>/dev/null || cp -r build_ios/Release-iphoneos/*.app Payload/
          fi
          zip -r pes2017_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/artifacts@v4
        with:
          name: pes2017-ios-ipa
          path: pes2017_unsigned.ipa

      - name: Post Code Checkout
        run: |
          echo "Processo finalizado com sucesso!"
