name: build-ios

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: build-ios
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest

      - name: Configure CMake for iOS Project
        run: |
          mkdir -p build_ios
          cd build_ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_CLEAN_BUILD=ON \
            -DCMAKE_C_FLAGS="-O3 -ffast-math" \
            -DCMAKE_CXX_FLAGS="-O3 -ffast-math"

      - name: Compile and Archive App
        run: |
          cd build_ios
          xcodebuild -target 'pes2017recomp' -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE=""

      - name: Package into Unsigned IPA with Mods & Ultra Performance Support
        run: |
          mkdir -p Payload
          if [ -d "build_ios/Release-iphoneos/pes2017recomp.app" ]; then
            cp -r build_ios/Release-iphoneos/pes2017recomp.app Payload/
          else
            cp -r build_ios/*.app Payload/ 2>/dev/null || cp -r build_ios/Release-iphoneos/*.app Payload/
          fi
          zip -r pes2017_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-ios-ipa
          path: pes2017_unsigned.ipa

      - name: Post Code Checkout
        run: |
          echo "Processo finalizado com sucesso de forma totalmente legal!"
