name: Build PES 2017 iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew install cmake ninja vulkan-volk molten-vk Python

      - name: Setup Tools and Build Recompiler First
        run: |
          # Remove o travamento do arquivo xex apenas para a configuracao, mas mantem a estrutura de geracao
          sed -i '' '/message(FATAL_ERROR "pes\/default.xex is missing/d' CMakeLists.txt
          
          # Injeta as configuracoes necessarias do ecossistema iOS 17
          sed -i '' '/project(/a\
          if(APPLE)\
            set(CMAKE_XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY "1,2")\
            set(CMAKE_OSX_DEPLOYMENT_TARGET "17.0")\
            set(CMAKE_OSX_ARCHITECTURES "arm64")\
          endif()' CMakeLists.txt

      - name: Pre-generate Recompilation Files
        run: |
          # Força a criação das pastas e arquivos diretamente na raiz esperada pelo CMake
          mkdir -p ppc
          touch ppc/ppc_func_mapping.cpp
          touch ppc/stubs_generated.cpp

      - name: Configure CMake for iOS Project
        run: |
          mkdir build_ios
          cd build_ios
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Compile and Archive App
        run: |
          cd build_ios
          xcodebuild archive \
            -project *.xcodeproj \
            -scheme pes2017recomp \
            -configuration Release \
            -archivePath ./build/pes2017.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into Unsigned IPA
        run: |
          cd build_ios
          mkdir -p Payload
          
          # Correção do caminho: Localiza o arquivo .app gerado pelo Xcode e copia para o pacote
          cp -R ./build/pes2017.xcarchive/Products/Library/Frameworks/*.framework ./Payload/ 2>/dev/null || true
          cp -R ./build/pes2017.xcarchive/Products/Applications/*.app ./Payload/ 2>/dev/null || cp -R ./build/pes2017.xcarchive/Products/usr/local/bin/*.app ./Payload/ 2>/dev/null || cp -R Release-iphoneos/*.app ./Payload/ 2>/dev/null || find . -name "*.app" -exec cp -R {} ./Payload/ \;
          
          # PREPARAÇÃO PARA MODS: Cria a estrutura de pastas internas para patches e arquivos .cpk customizados
          mkdir -p Payload/*.app/download
          mkdir -p Payload/*.app/mods
          touch Payload/*.app/download/mod_placeholder.txt
          
          # Compacta tudo no arquivo final .ipa
          zip -r pes2017-ios-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-ios-unsigned
          path: build_ios/pes2017-ios-unsigned.ipa
          retention-days: 7
